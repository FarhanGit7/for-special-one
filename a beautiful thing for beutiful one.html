<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffedf3">
<title>A Little Surprise ♡</title>
<style>
  :root { --pink:#ff6f9f; --deep:#a83261; --ink:#59243b; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100svh; overflow-x:hidden;
    display:grid; place-items:center; padding:22px;
    font-family: Georgia, "Times New Roman", serif; color:var(--ink);
    background:
      radial-gradient(circle at 15% 15%, #fff 0 2px, transparent 3px),
      radial-gradient(circle at 85% 25%, #fff9 0 3px, transparent 4px),
      linear-gradient(145deg,#fff0f5,#ffe0eb 48%,#fff7fa);
  }
  .glow { position:fixed; width:260px;height:260px;border-radius:50%;filter:blur(55px);opacity:.45;pointer-events:none;background:#ff9cbe; }
  .glow.one { top:-100px;left:-80px; } .glow.two { bottom:-120px;right:-70px;background:#d7a7ff; }
  .card {
    position:relative; width:min(100%,430px); padding:30px 23px 25px;
    text-align:center; border:1px solid #ffffffc9; border-radius:28px;
    background:#fffafce8; box-shadow:0 22px 70px #b54d7620, inset 0 1px #fff;
    backdrop-filter:blur(12px); animation:rise .8s ease both;
  }
  .top-heart { font-size:28px; animation:beat 1.5s infinite; display:inline-block; }
  .eyebrow { margin:7px 0 12px; font:600 11px/1.4 Arial,sans-serif; letter-spacing:3px;text-transform:uppercase;color:#bd6686; }
  h1 { font-size:clamp(31px,8vw,42px); line-height:1.08; margin:8px 0 12px; font-weight:normal; }
  .subtitle { font:14px/1.65 Arial,sans-serif;color:#936174;margin:0 auto 22px;max-width:300px; }
  .dialogue { min-height:130px; display:flex; flex-direction:column; justify-content:center; gap:11px; padding:17px 13px; margin:0 0 18px; border-radius:19px; background:linear-gradient(135deg,#fff0f5,#fff8fb); border:1px solid #f8d9e4; }
  .line { font-size:21px; line-height:1.35; animation:fade .35s ease; }
  .line.small { font:13px/1.5 Arial,sans-serif;color:#b56b87; }
  .btn {
    width:100%; border:0; border-radius:999px; padding:15px 18px; cursor:pointer;
    color:white; font:600 14px Arial,sans-serif; letter-spacing:.3px;
    background:linear-gradient(100deg,#ff78a4,#e85f91); box-shadow:0 9px 20px #f17ba044;
    transition:transform .18s,box-shadow .18s;
  }
  .btn:active { transform:scale(.98); }
  .secondary { background:#fff; color:#b94e78; border:1px solid #f3ccda; box-shadow:none; margin-top:10px; }
  .counter { margin-top:17px; font:11px Arial,sans-serif;letter-spacing:1px;color:#c28ba0; }
  .signature { font-style:italic;color:#b34f78;font-size:18px;margin-top:18px; }
  .heart { position:fixed;bottom:-35px;pointer-events:none;z-index:3;animation:floatUp linear forwards;opacity:.8; }
  .hidden { display:none !important; }
  @keyframes rise { from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)} }
  @keyframes fade { from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)} }
  @keyframes beat { 0%,100%{transform:scale(1)}50%{transform:scale(1.15)} }
  @keyframes floatUp { to{transform:translateY(-115vh) rotate(25deg);opacity:0} }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;scroll-behavior:auto !important} }
</style>
</head>
<body>
<div class="glow one"></div><div class="glow two"></div>
<main class="card">
  <div class="top-heart">♡</div>
  <p class="eyebrow">a tiny surprise for you</p>
  <h1>Knock, knock…</h1>
  <p class="subtitle">Someone left a little sweetness at your door. Will you answer? 💌</p>
  <section class="dialogue" aria-live="polite">
    <div class="line" id="mainLine">Knock, knock. 🚪</div>
    <div class="line small" id="subLine">A little surprise is waiting…</div>
  </section>
  <button class="btn" id="nextBtn">Who's there? ♡</button>
  <button class="btn secondary hidden" id="restartBtn">Read it again ↻</button>
  <div class="counter" id="counter">A LITTLE NOTE • 01</div>
  <div class="signature hidden" id="signature">Just a reminder: you make the world a little softer. ♡</div>
</main>
<script>
const moments = [
  ["Knock, knock. 🚪", "A little surprise is waiting…", "Who's there? ♡"],
  ["Wire .", "Okay, now say it…", "Wire who? 💗"],
  ["Wire U so beautifull! 💕", "And that's only the beginning.", "Aww, continue ✨"],
  ["Knock, knock. 🌷", "Round two…", "Who's there? ♡"],
  ["Dew. 💧", "Your turn…", "Dew who? 💞"],
  ["Dew know how wonderful you are?", "Because you deserve to hear it.", "Tell me more 💌"],
  ["Knock, knock. 🌙", "One last one…", "Who's there? ♡"],
  ["A little star. ⭐", "A little star who?…", "Who? 👀"],
  ["A little star who hopes you smile today. ✨", "Because your smile deserves its own little universe.", "Open your compliments 💖"],
  ["Your compliments 💗", "You have a lovely way of making ordinary moments feel special.", "One more 🌸"],
  ["And another… 🌸", "You deserve kindness, peace, and people who appreciate the real you.", "Keep going 💞"],
  ["Last one, promise. 💌", "You bring something uniquely you into the world—and that's worth celebrating.", "Finish with a hug ♡"],
  ["Sending you a pocketful of hugs. 🫶", "No pressure to say anything back. I just wanted to make you smile.", "Start over ↻"]
];
let index = 0;
const mainLine = document.getElementById('mainLine');
const subLine = document.getElementById('subLine');
const nextBtn = document.getElementById('nextBtn');
const restartBtn = document.getElementById('restartBtn');
const counter = document.getElementById('counter');
const signature = document.getElementById('signature');

function render() {
  const m = moments[index];
  mainLine.textContent = m[0];
  subLine.textContent = m[1];
  nextBtn.textContent = m[2];
  counter.textContent = `A LITTLE NOTE • ${String(index + 1).padStart(2,'0')}`;
  const done = index === moments.length - 1;
  nextBtn.classList.toggle('hidden', done);
  restartBtn.classList.toggle('hidden', !done);
  signature.classList.toggle('hidden', !done);
  if ([2,5,8,9,10,11,12].includes(index)) sprinkle();
}
nextBtn.addEventListener('click', () => { if (index < moments.length - 1) index++; render(); });
restartBtn.addEventListener('click', () => { index = 0; render(); });
function sprinkle() {
  const symbols = ['♡','♥','💗','✧','💕'];
  for (let i=0;i<5;i++) {
    const el = document.createElement('span');
    el.className = 'heart';
    el.textContent = symbols[Math.floor(Math.random()*symbols.length)];
    el.style.left = Math.random()*100 + 'vw';
    el.style.fontSize = (15 + Math.random()*16) + 'px';
    el.style.animationDuration = (4 + Math.random()*3) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 7500);
  }
}
render();
</script>
</body>
</html>
